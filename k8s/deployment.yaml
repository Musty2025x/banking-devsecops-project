apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bank-api
  template:
    metadata:
      labels:
        app: bank-api
    spec:
      imagePullSecrets:
      - name: aws-registry-key
      containers:
      - name: bank-api
        image: 300272447770.dkr.ecr.us-east-1.amazonaws.com/bank-api:latest
        ports:
        - containerPort: 5000
